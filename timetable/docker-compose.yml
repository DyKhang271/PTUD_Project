version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: timetable-postgres
    environment:
      POSTGRES_DB: timetable
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1307
    ports:
      - "5433:5432"
    volumes:
      - timetable_pg_data:/var/lib/postgresql/data

  backend:
    image: python:3.12-slim
    container_name: timetable-backend
    working_dir: /workspace
    command: >
      sh -c "pip install -r requirements.txt &&
             alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:1307@postgres:5432/timetable
      CORE_API_BASE_URL: http://host.docker.internal:8000
      CORE_API_KEY: dev-internal-secret
      SECRET_KEY: change-me-in-production
      ALLOWED_ORIGINS: http://localhost:5174,http://localhost:8080
    volumes:
      - .:/workspace
    ports:
      - "8001:8001"
    depends_on:
      - postgres

  frontend:
    image: node:20-alpine
    container_name: timetable-frontend
    working_dir: /workspace/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:8001
    volumes:
      - .:/workspace
    ports:
      - "5174:5174"
    depends_on:
      - backend

volumes:
  timetable_pg_data:
