version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: timetable-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: timetable
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - timetable_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d timetable"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    image: python:3.12-slim
    container_name: timetable-backend
    restart: unless-stopped
    working_dir: /workspace
    command: >
      sh -c "pip install -r requirements.txt &&
             pip install python-multipart &&
             alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/timetable
      CORE_API_BASE_URL: http://host.docker.internal:8000
      CORE_API_KEY: dev-internal-secret
      SECRET_KEY: change-me-in-production
      PORTAL_JWT_SECRET: student-portal-dev-secret
      PORTAL_JWT_ISSUER: student-portal
      PORTAL_JWT_ALGORITHM: HS256
      ALLOWED_ORIGINS: http://localhost:5174,http://127.0.0.1:5174,http://localhost:8001,http://127.0.0.1:8001
    volumes:
      - .:/workspace
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: timetable-frontend
    restart: unless-stopped
    working_dir: /workspace/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_TIMETABLE_API_BASE_URL: http://localhost:8001
      VITE_PORTAL_API_BASE_URL: http://localhost:8000/api
    volumes:
      - .:/workspace
      - timetable_frontend_node_modules:/workspace/frontend/node_modules
    ports:
      - "5174:5174"
    depends_on:
      - backend

volumes:
  timetable_pg_data:
  timetable_frontend_node_modules:
