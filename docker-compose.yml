services:
  postgres:
    image: postgres:16-alpine
    container_name: student-portal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: student_portal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - student_portal_postgres_data:/var/lib/postgresql/data
      - ./Student Portal/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d student_portal"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    container_name: student-portal-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./Student Portal/backend
    container_name: student-portal-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5174,http://127.0.0.1:5174
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/student_portal
      INTERNAL_API_KEY: dev-internal-secret
      PORTAL_JWT_SECRET: student-portal-dev-secret
      PORTAL_JWT_ISSUER: student-portal
      PORTAL_JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: gemma4:31b-cloud
      RAG_DOCUMENTS_DIR: /rag_docs
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./Student Portal/data_json:/data_json:ro
      - ./Student Portal/RAG_docx:/rag_docs:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./Student Portal/frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: student-portal-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1/ >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  student_portal_postgres_data:
  ollama_data:
