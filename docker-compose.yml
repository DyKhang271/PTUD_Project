services:
  postgres:
    image: postgres:16-alpine
    container_name: timetable-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: timetable
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - timetable_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d timetable"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    image: python:3.12-slim
    container_name: timetable-backend
    restart: unless-stopped
    working_dir: /workspace
    command: >
      sh -c "pip install -r requirements.txt &&
             pip install python-multipart &&
             alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8001"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/timetable
      CORE_API_BASE_URL: ${CORE_API_BASE_URL:-http://host.docker.internal:8000}
      CORE_API_KEY: ${CORE_API_KEY:-dev-internal-secret}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      PORTAL_JWT_SECRET: ${PORTAL_JWT_SECRET:-student-portal-dev-secret}
      PORTAL_JWT_ISSUER: ${PORTAL_JWT_ISSUER:-student-portal}
      PORTAL_JWT_ALGORITHM: ${PORTAL_JWT_ALGORITHM:-HS256}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5174,http://127.0.0.1:5174,http://localhost:8080,http://127.0.0.1:8080}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./timetable:/workspace
    ports:
      - "8001:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8001/').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    image: node:20-alpine
    container_name: timetable-frontend
    restart: unless-stopped
    working_dir: /workspace/frontend
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5174"
    environment:
      VITE_TIMETABLE_API_BASE_URL: ${VITE_TIMETABLE_API_BASE_URL:-http://localhost:8001}
      VITE_PORTAL_API_BASE_URL: ${VITE_PORTAL_API_BASE_URL:-http://localhost:8000/api}
    volumes:
      - ./timetable:/workspace
      - timetable_frontend_node_modules:/workspace/frontend/node_modules
    ports:
      - "5174:5174"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:5174/ >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  bootstrap-demo:
    image: python:3.12-slim
    container_name: timetable-bootstrap-demo
    profiles: ["bootstrap"]
    restart: "no"
    environment:
      PORTAL_LOGIN_URL: ${PORTAL_LOGIN_URL:-http://host.docker.internal:8000/api/auth/admin-login}
      TIMETABLE_SOURCE_TERMS_URL: http://backend:8001/admin/import/source-terms
      TIMETABLE_SEED_URL: http://backend:8001/admin/import/seed-from-core
    volumes:
      - ./timetable/scripts/bootstrap_demo.py:/bootstrap_demo.py:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    command: ["python", "/bootstrap_demo.py"]

volumes:
  timetable_pg_data:
  timetable_frontend_node_modules:
