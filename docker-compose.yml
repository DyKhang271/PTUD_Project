services:
  postgres:
    image: postgres:16-alpine
    container_name: student-portal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: student_portal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - student_portal_postgres_data:/var/lib/postgresql/data
      - ./Student Portal/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d student_portal"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    container_name: student-portal-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./Student Portal/backend
    container_name: student-portal-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5174,http://127.0.0.1:5174
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/student_portal
      INTERNAL_API_KEY: dev-internal-secret
      PORTAL_JWT_SECRET: student-portal-dev-secret
      PORTAL_JWT_ISSUER: student-portal
      PORTAL_JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b-instruct
      RAG_DOCUMENTS_DIR: /rag_docs
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./Student Portal/data_json:/data_json:ro
      - ./Student Portal/RAG_docx:/rag_docs:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./Student Portal/frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: student-portal-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1/ >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  timetable-postgres:
    image: postgres:16-alpine
    container_name: timetable-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: timetable
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - timetable_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d timetable"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  timetable-backend:
    image: python:3.12-slim
    container_name: timetable-backend
    restart: unless-stopped
    working_dir: /workspace
    command: >
      sh -c "pip install -r requirements.txt &&
             pip install python-multipart &&
             alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8001"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@timetable-postgres:5432/timetable
      CORE_API_BASE_URL: http://backend:8000
      CORE_API_KEY: dev-internal-secret
      SECRET_KEY: change-me-in-production
      PORTAL_JWT_SECRET: student-portal-dev-secret
      PORTAL_JWT_ISSUER: student-portal
      PORTAL_JWT_ALGORITHM: HS256
      ALLOWED_ORIGINS: http://localhost:5174,http://127.0.0.1:5174,http://localhost:8080,http://127.0.0.1:8080
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./timetable:/workspace
    ports:
      - "8001:8001"
    depends_on:
      timetable-postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8001/').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  timetable-frontend:
    image: node:20-alpine
    container_name: timetable-frontend
    restart: unless-stopped
    working_dir: /workspace/frontend
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5174"
    environment:
      VITE_TIMETABLE_API_BASE_URL: http://localhost:8001
      VITE_PORTAL_API_BASE_URL: http://localhost:8000/api
    volumes:
      - ./timetable:/workspace
      - timetable_frontend_node_modules:/workspace/frontend/node_modules
    ports:
      - "5174:5174"
    depends_on:
      timetable-backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:5174/ >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  bootstrap-demo:
    image: python:3.12-slim
    container_name: bootstrap-demo
    profiles: ["bootstrap"]
    restart: "no"
    environment:
      PORTAL_LOGIN_URL: http://backend:8000/api/auth/admin-login
      TIMETABLE_SOURCE_TERMS_URL: http://timetable-backend:8001/admin/import/source-terms
      TIMETABLE_SEED_URL: http://timetable-backend:8001/admin/import/seed-from-core
    volumes:
      - ./timetable/scripts/bootstrap_demo.py:/bootstrap_demo.py:ro
    depends_on:
      backend:
        condition: service_healthy
      timetable-backend:
        condition: service_healthy
    command: ["python", "/bootstrap_demo.py"]

volumes:
  student_portal_postgres_data:
  timetable_pg_data:
  ollama_data:
  timetable_frontend_node_modules:
